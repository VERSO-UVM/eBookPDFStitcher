<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Page</title>
    <link rel="icon" href="/static/favicon/favicon.ico">
    <link rel="stylesheet" href="/static/index.css">
</head>

<body>
    <header>
        <h1> Pdf Stitcher</h1>
        <p>
            Hello! This website is here to help you stitch together multiple pdf together.
        </p>
    </header>
    <form action="/" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" multiple accept=".pdf" required />
        <button type="submit" name="action" value="upload">Upload</button>
    </form>
    <footer>
        This website has been developed by Orca (Open Research Community Accelerator) at UVM
    </footer>
</body>

</html>
